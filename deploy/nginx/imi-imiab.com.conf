# HTTP origin, matching the existing samsara site. Cloudflare handles visitor TLS.
server {
    listen 80;
    listen [::]:80;
    server_name imi-imiab.com;

    root /etc/daimi/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    etag on;
    absolute_redirect off;
    disable_symlinks on from=$document_root;

    access_log /etc/daimi/logs/access.log;
    error_log /etc/daimi/logs/error.log warn;

    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;
    add_header Cache-Control "no-cache" always;

    location ~ (^|/)\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Ubuntu's Nginx 1.18 MIME table predates AVIF support.
    location ~* \.avif$ {
        types { image/avif avif; }
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
